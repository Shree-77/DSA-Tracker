name: dsa_tracker
description: Study Tracker - a daily study preparation tracker (Flutter client).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  http: ^1.2.0

  # State management (lightweight, simplest maintainable option)
  provider: ^6.1.2

  # Local persistence / config / offline cache
  shared_preferences: ^2.2.3

  # File picking for Excel import
  file_picker: ^13.0.0

  # Formatting
  intl: ^0.20.2

  # Local notifications (optional feature; app works without it)
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # Optional: use a separate image with safe-zone padding for adaptive icons.
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
